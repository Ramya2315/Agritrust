services:
  - type: web
    name: agritrustra
    runtime: node
    plan: free
    buildCommand: npm install && npm run ml:install && npm run build:prod
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: DISABLE_MONGODB
        value: "false"
      - key: SEED_DEMO_DATA
        value: "false"
      - key: AI_MODEL_DIR
        value: ml/artifacts/plant-health-model
      - key: TOMATO_PRICE_MODEL_DIR
        value: ml/artifacts/tomato-price-model
      - key: PYTHON_BIN
        value: python
      - key: AI_CONFIDENCE_THRESHOLD
        value: "0.65"
      - key: OTP_DELIVERY_PROVIDER
        value: console
