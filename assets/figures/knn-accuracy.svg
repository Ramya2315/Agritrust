<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" role="img" aria-labelledby="title desc">
  <title id="title">KNN Accuracy Graph for AgriTrustra</title>
  <desc id="desc">Line graph showing KNN accuracy for K values 1, 3, 5, 7 and 9.</desc>
  <rect width="720" height="430" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">KNN Accuracy for Organic Farm Detection</text>
  <line x1="90" y1="345" x2="660" y2="345" stroke="#333" stroke-width="1.5"/>
  <line x1="90" y1="60" x2="90" y2="345" stroke="#333" stroke-width="1.5"/>
  <g font-family="Arial, sans-serif" font-size="12" fill="#333">
    <text x="84" y="349" text-anchor="end">87</text>
    <text x="84" y="292" text-anchor="end">88</text>
    <text x="84" y="235" text-anchor="end">89</text>
    <text x="84" y="178" text-anchor="end">90</text>
    <text x="84" y="121" text-anchor="end">92</text>
    <text x="84" y="64" text-anchor="end">93</text>
    <text x="90" y="365" text-anchor="middle">1</text>
    <text x="232" y="365" text-anchor="middle">3</text>
    <text x="375" y="365" text-anchor="middle">5</text>
    <text x="518" y="365" text-anchor="middle">7</text>
    <text x="660" y="365" text-anchor="middle">9</text>
    <text x="375" y="400" text-anchor="middle">K Values</text>
    <text x="24" y="205" text-anchor="middle" transform="rotate(-90 24 205)">Accuracy (%)</text>
  </g>
  <g stroke="#2f80c9" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="90,345 232,231 375,174 518,88 660,60"/>
  </g>
  <g fill="#2f80c9">
    <circle cx="90" cy="345" r="5"/>
    <circle cx="232" cy="231" r="5"/>
    <circle cx="375" cy="174" r="5"/>
    <circle cx="518" cy="88" r="5"/>
    <circle cx="660" cy="60" r="5"/>
  </g>
</svg>
