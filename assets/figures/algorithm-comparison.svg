<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" role="img" aria-labelledby="title desc">
  <title id="title">Algorithm Comparison Bar Chart</title>
  <desc id="desc">Bar chart comparing KNN, GMM, CNN and SVM accuracy.</desc>
  <rect width="720" height="430" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">Organic Certification Algorithm Comparison</text>
  <line x1="90" y1="345" x2="660" y2="345" stroke="#333" stroke-width="1.5"/>
  <line x1="90" y1="60" x2="90" y2="345" stroke="#333" stroke-width="1.5"/>
  <g font-family="Arial, sans-serif" font-size="12" fill="#333">
    <text x="84" y="349" text-anchor="end">0</text>
    <text x="84" y="292" text-anchor="end">20</text>
    <text x="84" y="235" text-anchor="end">40</text>
    <text x="84" y="178" text-anchor="end">60</text>
    <text x="84" y="121" text-anchor="end">80</text>
    <text x="84" y="64" text-anchor="end">100</text>
    <text x="160" y="365" text-anchor="middle">KNN</text>
    <text x="293" y="365" text-anchor="middle">GMM</text>
    <text x="426" y="365" text-anchor="middle">CNN</text>
    <text x="559" y="365" text-anchor="middle">SVM</text>
    <text x="360" y="400" text-anchor="middle">Algorithms</text>
    <text x="24" y="205" text-anchor="middle" transform="rotate(-90 24 205)">Accuracy (%)</text>
  </g>
  <g fill="#7ec8e3">
    <rect x="117" y="88.5" width="86" height="256.5"/>
    <rect x="250" y="102.75" width="86" height="242.25"/>
    <rect x="383" y="82.8" width="86" height="262.2"/>
    <rect x="516" y="77.1" width="86" height="267.9"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#222" text-anchor="middle">
    <text x="160" y="80">90%</text>
    <text x="293" y="94">85%</text>
    <text x="426" y="74">92%</text>
    <text x="559" y="68">94%</text>
  </g>
</svg>
